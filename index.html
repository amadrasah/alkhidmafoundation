<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল খিদমাহ্ ফাউন্ডেশন</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SolaimanLipi&display=swap');
        body {
            font-family: 'SolaimanLipi', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Top Header -->
    <header class="bg-emerald-700 text-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold">আল খিদমাহ্ ফাউন্ডেশন</h1>
        <p class="text-emerald-200 text-sm mt-1">মানুষের জন্য, মানুষের পাশে</p>
        <p class="text-xs text-emerald-100 mt-1"><i class="fa-solid fa-location-dot"></i> পাটেয়ারীটারী, দলগ্রাম, কালীগঞ্জ, লালমনিরহাট</p>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-6 space-y-6 max-w-3xl">

        <!-- নতুন সদস্য যুক্ত করার ফর্ম -->
        <div class="bg-white rounded-xl shadow-md p-6 border-t-4 border-emerald-600">
            <h2 class="text-xl font-bold text-emerald-800 mb-4"><i class="fa-solid fa-user-plus mr-2"></i>পরিচালনা পরিষদে নতুন সদস্য যুক্ত করুন</h2>
            <form id="committeeForm" onsubmit="addMember(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">সদস্যের নাম</label>
                    <input type="text" id="name" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-600 outline-none" placeholder="পূর্ণ নাম লিখুন">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">পদবী</label>
                    <input type="text" id="role" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-600 outline-none" placeholder="যেমন: সভাপতি, সাধারণ সম্পাদক">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">মোবাইল নম্বর</label>
                    <input type="text" id="phone" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-600 outline-none" placeholder="মোবাইল নম্বর লিখুন">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-700 transition shadow">
                    সদস্য সংরক্ষণ করুন
                </button>
            </form>
        </div>

        <!-- সদস্য তালিকা টেবিল -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold text-emerald-800 mb-4"><i class="fa-solid fa-users mr-2"></i>পরিচালনা পরিষদ সদস্য তালিকা</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-emerald-100 text-emerald-900 border-b text-sm">
                            <th class="p-3">ক্রঃ নং</th>
                            <th class="p-3">নাম</th>
                            <th class="p-3">পদবী</th>
                            <th class="p-3">মোবাইল নম্বর</th>
                            <th class="p-3 text-center">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y text-sm">
                        <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে ডেটা আসবে -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-emerald-900 text-emerald-200 py-4 text-center text-xs mt-10">
        <p>&copy; ২০২৬ আল খিদমাহ্ ফাউন্ডেশন | সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let members = JSON.parse(localStorage.getItem('alkhidmahMembers')) || [
            { name: "মোঃ আব্দুর রহিম", role: "সভাপতি", phone: "০১৭০০০০০০০০" },
            { name: "মোঃ শফিকুল ইসলাম", role: "সাধারণ সম্পাদক", phone: "০১৮০০০০০০০০" }
        ];

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            members.forEach((m, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3">${index + 1}</td>
                        <td class="p-3 font-medium">${m.name}</td>
                        <td class="p-3">${m.role}</td>
                        <td class="p-3">${m.phone}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteMember(${index})" class="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-semibold hover:bg-rose-200">মুছে ফেলুন</button>
                        </td>
                    </tr>
                `;
            });
        }

        function addMember(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const phone = document.getElementById('phone').value;

            members.push({ name, role, phone });
            localStorage.setItem('alkhidmahMembers', JSON.stringify(members));

            document.getElementById('committeeForm').reset();
            renderTable();
            alert('সদস্য সফলভাবে যুক্ত হয়েছে!');
        }

        function deleteMember(index) {
            if(confirm('আপনি কি এই সদস্যকে তালিকা থেকে মুছে ফেলতে চান?')) {
                members.splice(index, 1);
                localStorage.setItem('alkhidmahMembers', JSON.stringify(members));
                renderTable();
            }
        }

        window.onload = renderTable;
    </script>
</body>
</html>
