    <!-- JavaScript -->
    <script>
        window.isAdmin = window.isAdmin || (localStorage.getItem('alkhidmahAdmin') === 'true');
        let isAdmin = window.isAdmin;

        function toggleAdminMode() {
            if (isAdmin) {
                if(confirm('এডমিন মোড থেকে বের হতে চান?')) {
                    localStorage.setItem('alkhidmahAdmin', 'false');
                    window.isAdmin = false;
                    isAdmin = false;
                    applyAdminModeUI();
                    alert('এডমিন মোড থেকে লগআউট করা হয়েছে।');
                    showSection('home');
                }
            } else {
                let pass = prompt("এডমিন পাসওয়ার্ড প্রদান করুন:");
                if (pass === '1234') { 
                    localStorage.setItem('alkhidmahAdmin', 'true');
                    window.isAdmin = true;
                    isAdmin = true;
                    applyAdminModeUI();
                    alert('সফলভাবে এডমিন মোডে প্রবেশ করেছেন!');
                } else if(pass !== null) {
                    alert('ভুল পাসওয়ার্ড!');
                }
            }
        }

        function applyAdminModeUI() {
            const adminElements = document.querySelectorAll('.admin-only');
            const adminActionCols = document.querySelectorAll('.admin-action-col');
            const navMemberForm = document.getElementById('navMemberForm');
            const navInbox = document.getElementById('navInbox');
            const adminBtn = document.getElementById('adminModeBtn');
            const calContainer = document.getElementById('calendarTableContainer');
            const calFormCard = document.getElementById('eventFormCard');

            if (isAdmin) {
                adminElements.forEach(el => el.classList.remove('hidden'));
                adminActionCols.forEach(el => el.classList.remove('hidden'));
                if(navMemberForm) navMemberForm.classList.remove('hidden');
                if(navInbox) navInbox.classList.remove('hidden');
                if(adminBtn) {
                    adminBtn.innerHTML = '<i class="fa-solid fa-unlock mr-1"></i> এডমিন লগআউট';
                    adminBtn.className = "bg-rose-800 hover:bg-rose-900 text-white text-xs px-3 py-2 rounded-lg border border-rose-600 font-semibold transition";
                }
                if(calContainer) calContainer.className = "bg-white rounded-xl shadow p-6 md:col-span-2 overflow-x-auto";
                if(calFormCard) calFormCard.classList.remove('hidden');
            } else {
                adminElements.forEach(el => el.classList.add('hidden'));
                adminActionCols.forEach(el => el.classList.add('hidden'));
                if(navMemberForm) navMemberForm.classList.add('hidden');
                if(navInbox) navInbox.classList.add('hidden');
                if(adminBtn) {
                    adminBtn.innerHTML = '<i class="fa-solid fa-lock mr-1"></i> এডমিন লগইন';
                    adminBtn.className = "bg-emerald-800 hover:bg-emerald-900 text-yellow-300 text-xs px-3 py-2 rounded-lg border border-emerald-600 font-semibold transition";
                }
                if(calContainer) calContainer.className = "bg-white rounded-xl shadow p-6 md:col-span-3 overflow-x-auto";
                if(calFormCard) calFormCard.classList.add('hidden');
            }
            renderAllTables();
        }

        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        if(menuToggle && navMenu) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                navMenu.classList.toggle('hidden');
            });
        }

        function closeMobileMenu() {
            if(navMenu) navMenu.classList.add('hidden');
            document.querySelectorAll('.dropdown-content').forEach(el => el.classList.add('hidden'));
        }

        function toggleDropdown(event, dropdownId) {
            event.preventDefault();
            event.stopPropagation();
            const currentDropdown = document.getElementById(dropdownId);
            if(!currentDropdown) return;
            const isHidden = currentDropdown.classList.contains('hidden');
            document.querySelectorAll('.dropdown-content').forEach(el => el.classList.add('hidden'));
            if (isHidden) {
                currentDropdown.classList.remove('hidden');
            } else {
                currentDropdown.classList.add('hidden');
            }
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('nav')) {
                closeMobileMenu();
            }
        });

        function showSection(sectionId) {
            const sections = document.querySelectorAll('.page-section');
            sections.forEach(sec => sec.classList.add('hidden'));
            const target = document.getElementById(sectionId);
            if(target) {
                target.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        let allData = JSON.parse(localStorage.getItem('alkhidmahAllData')) || {
            committee: [
                { name: "মোঃ আব্দুর রহিম", role: "সভাপতি", amount: 1000, phone: "০১৭০০০০০০০০" },
                { name: "মোঃ শফিকুল ইসলাম", role: "সাধারণ সম্পাদক", amount: 500, phone: "০১৮০০০০০০০০" }
            ],
            advisors: [
                { name: "অধ্যাপক ড. মোঃ নজরুল ইসলাম", role: "প্রধান উপদেষ্টা", amount: 2000, phone: "০১৯০০০০০০০০" }
            ],
            members: [
                { name: "মোঃ রফিকুল ইসলাম", role: "সাধারণ সদস্য", amount: 200, phone: "০১৫০০০০০০০০" }
            ],
            donors: [
                { name: "আলহাজ্ব আব্দুল লতিফ", role: "আজীবন দাতা", amount: 5000, phone: "০১৭১۱০০০০০০" }
            ],
            beneficiaries: [
                { name: "মোছাঃ ফাতেমা খাতুন", role: "শিক্ষা সহায়তা", amount: 1500, phone: "০১৮১১০০০০০০" }
            ],
            runningActivities: [
                { name: "শীতবস্ত্র বিতরণ", startDate: "2026-11-01", endDate: "2026-11-30", beneficiary: "অসহায় ও দরিদ্র শীতার্ত মানুষ", area: "দলগ্রাম ইউনিয়ন", estCost: 25000, costSector: "সদস্যদের মাসিক অনুদান" }
            ],
            pastActivities: [
                { name: "ঈদ সামগ্রী বিতরণ", startDate: "2026-04-01", endDate: "2026-04-10", beneficiary: "১০০টি দুস্থ পরিবার", area: "কালীগঞ্জ উপজেলা", actualCost: 45000, costSector: "বিশেষ ফান্ডে দান" }
            ],
            transactions: [
                { date: "2026-10-01", donor: "মোঃ রফিকুল ইসলাম", sector: "সদস্যদের মাসিক অনুদান", type: "income", amount: 5000 },
                { date: "2026-10-02", donor: "আল খিদমাহ ফাউন্ডেশন", sector: "অফিস ও অন্যান্য আনুষঙ্গিক ব্যয়", type: "expense", amount: 1000 }
            ],
            calendarEvents: [
                { title: "কার্যকরী কমিটির মাসিক সভা", date: "2026-10-10", timeLocation: "বিকাল ৪:০০ টা, দলগ্রাম কার্যালয়" },
                { title: "শিক্ষা উপকরণ বিতরণ কর্মসূচি", date: "2026-10-20", timeLocation: "সকাল ১০:০০ টা, পাটেয়ারীটারী স্কুল" }
            ],
            galleryImages: [
                { title: "ঈদ সামগ্রী বিতরণ কার্যক্রম ২০২৬", url: "https://images.unsplash.com/photo-1532629345422-7515f3d16bb9?w=600" },
                { title: "ফাউন্ডেশনের মাসিক সভা", url: "https://images.unsplash.com/photo-1531482615713-2afd69097998?w=600" }
            ],
            messages: [
                { date: "01/10/2026", name: "আব্দুল্লাহ আল মামুন", phone: "০১৭০০০০০০০০", message: "ফাউন্ডেশনের কার্যক্রম সম্পর্কে জানতে চাই।" }
            ]
        };

        const incomeSectors = [
            "সদস্যদের মাসিক অনুদান", "দাতা সদস্যের অনুদান", "উপদেষ্টা পরিষদের অনুদান",
            "সাধারণ দান", "এককালীন অনুদান", "বিশেষ ফান্ডে দান", "অন্যান্য"
        ];

        const expenseSectors = [
            "শীতবস্ত্র ক্রয় ও বিতরণ খরচ", "শিক্ষা উপকরণ ও শিক্ষাবৃত্তি বিতরণ",
            "চিকিৎসা সহায়তা খরচ", "অফিস ও অন্যান্য আনুষঙ্গিক ব্যয়", "জরুরি ত্রাণ বিতরণ খরচ", "অন্যান্য ব্যয়"
        ];

        function updateSectorDropdown() {
            const typeElem = document.getElementById('transType');
            const sectorSelect = document.getElementById('transSector');
            if(!typeElem || !sectorSelect) return;
            const type = typeElem.value;
            sectorSelect.innerHTML = '';
            const list = type === 'income' ? incomeSectors : expenseSectors;
            list.forEach(sec => {
                sectorSelect.innerHTML += `<option value="${sec}">${sec}</option>`;
            });
        }

        function checkCustomRunningActivity() {
            const catElem = document.getElementById('runActCategory');
            const customDiv = document.getElementById('customRunningFieldDiv');
            const customNameElem = document.getElementById('customRunningName');
            if(!catElem || !customDiv) return;
            
            if(catElem.value === 'অন্যান্য') {
                customDiv.classList.remove('hidden');
                if(customNameElem) customNameElem.required = true;
            } else {
                customDiv.classList.add('hidden');
                if(customNameElem) customNameElem.required = false;
            }
        }

        function renderAllTables() {
            renderTableSection('committee', 'committeeTableBody');
            renderTableSection('advisors', 'advisorsTableBody');
            renderTableSection('members', 'membersTableBody');
            renderTableSection('donors', 'donorsTableBody');
            renderBeneficiariesTable();
            renderRunningActivitiesTable();
            renderPastActivitiesTable();
            renderDueTracking();
            renderTransactions();
            renderCalendarEvents();
            renderGallery();
            renderInbox();
            updateDashboardStats();
            updateSectorDropdown();
        }

        function updateDashboardStats() {
            const cCount = document.getElementById('dashCommitteeCount');
            const mCount = document.getElementById('dashMembersCount');
            const dCount = document.getElementById('dashDonorsCount');
            const bCount = document.getElementById('dashBeneficiariesCount');

            if(cCount) cCount.innerText = (allData.committee || []).length;
            if(mCount) mCount.innerText = (allData.members || []).length;
            if(dCount) dCount.innerText = (allData.donors || []).length;
            if(bCount) bCount.innerText = (allData.beneficiaries || []).length;

            let totalIncome = 0;
            let totalExpense = 0;
            (allData.transactions || []).forEach(t => {
                if(t.type === 'income') totalIncome += Number(t.amount);
                else totalExpense += Number(t.amount);
            });

            const tInc = document.getElementById('dashTotalIncome');
            const tExp = document.getElementById('dashTotalExpense');
            const netElem = document.getElementById('dashNetBalance');

            if(tInc) tInc.innerText = `৳ ${totalIncome.toLocaleString()}`;
            if(tExp) tExp.innerText = `৳ ${totalExpense.toLocaleString()}`;
            
            if(netElem) {
                let net = totalIncome - totalExpense;
                netElem.innerText = `৳ ${net.toLocaleString()}`;
                netElem.className = `text-3xl font-bold mt-2 ${net >= 0 ? 'text-blue-600' : 'text-rose-600'}`;
            }
        }

        function renderTableSection(category, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            if (!tbody) return;
            tbody.innerHTML = '';
            const items = allData[category];
            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 6 : 5}" class="p-4 text-center text-gray-400 text-sm">কোনো তথ্য নেই</td></tr>`;
                return;
            }
            items.forEach((item, index) => {
                let amt = item.amount ? `৳ ${Number(item.amount).toLocaleString()}` : '৳ ০';
                let actionTd = isAdmin ? `<td class="p-3 text-center"><button onclick="deleteItem('${category}', ${index})" class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded text-xs font-semibold hover:bg-rose-200">মুছে ফেলুন</button></td>` : '';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3">${index + 1}</td>
                        <td class="p-3 font-medium">${item.name}</td>
                        <td class="p-3">${item.role}</td>
                        <td class="p-3 font-semibold text-emerald-700">${amt}</td>
                        <td class="p-3">${item.phone}</td>
                        ${actionTd}
                    </tr>
                `;
            });
        }

        function renderBeneficiariesTable() {
            const tbody = document.getElementById('beneficiariesTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            const items = allData.beneficiaries;
            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 6 : 5}" class="p-4 text-center text-gray-400 text-sm">কোনো তথ্য নেই</td></tr>`;
                return;
            }
            items.forEach((item, index) => {
                let amt = item.amount ? `৳ ${Number(item.amount).toLocaleString()}` : '৳ ০';
                let actionTd = isAdmin ? `<td class="p-3 text-center"><button onclick="deleteItem('beneficiaries', ${index})" class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded text-xs font-semibold hover:bg-rose-200">মুছে ফেলুন</button></td>` : '';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3">${index + 1}</td>
                        <td class="p-3 font-medium">${item.name}</td>
                        <td class="p-3">${item.role}</td>
                        <td class="p-3 font-semibold text-purple-700">${amt}</td>
                        <td class="p-3">${item.phone}</td>
                        ${actionTd}
                    </tr>
                `;
            });
        }

        function addRunningActivity(e) {
            e.preventDefault();
            let cat = document.getElementById('runActCategory').value;
            if(cat === 'অন্যান্য') {
                cat = document.getElementById('customRunningName').value;
            }
            const startDate = document.getElementById('runActStartDate').value;
            const endDate = document.getElementById('runActEndDate').value;
            const beneficiary = document.getElementById('runActBeneficiary').value;
            const area = document.getElementById('runActArea').value;
            const estCost = parseFloat(document.getElementById('runActEstCost').value) || 0;
            const costSector = document.getElementById('runActCostSector').value;

            if(!allData.runningActivities) allData.runningActivities = [];
            allData.runningActivities.push({ name: cat, startDate, endDate, beneficiary, area, estCost, costSector });
            localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));

            document.getElementById('runningActivityForm').reset();
            document.getElementById('customRunningFieldDiv').classList.add('hidden');
            renderRunningActivitiesTable();
            alert('চলমান কর্মসূচি সফলভাবে যুক্ত হয়েছে!');
        }

        function renderRunningActivitiesTable() {
            const tbody = document.getElementById('runningActivitiesTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';
            const items = allData.runningActivities || [];
            if(items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 7 : 6}" class="p-4 text-center text-gray-400 text-sm">কোনো চলমান কর্মসূচি নেই</td></tr>`;
                return;
            }
            items.forEach((item, index) => {
                let actionTd = isAdmin ? `
                    <td class="p-3 text-center space-x-1">
                        <button onclick="completeRunningActivity(${index})" class="bg-emerald-600 text-white px-2.5 py-1 rounded text-xs font-semibold hover:bg-emerald-700">সমাপ্ত করুন</button>
                        <button onclick="deleteRunningActivity(${index})" class="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-semibold hover:bg-rose-200">ডিলিট</button>
                    </td>` : '';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-medium text-emerald-800">${item.name}</td>
                        <td class="p-3 text-xs">${item.startDate} হতে<br>${item.endDate}</td>
                        <td class="p-3">${item.beneficiary}</td>
                        <td class="p-3">${item.area}</td>
                        <td class="p-3 font-semibold text-blue-700">৳ ${Number(item.estCost).toLocaleString()}</td>
                        <td class="p-3 text-xs">${item.costSector}</td>
                        ${actionTd}
                    </tr>
                `;
            });
        }

        function completeRunningActivity(index) {
            let actualCostInput = prompt("এই কর্মসূচির প্রকৃত বা চূড়ান্ত ব্যয় কত হয়েছে (টাকা লিখুন):", allData.runningActivities[index].estCost);
            if(actualCostInput === null) return;
            let actualCost = parseFloat(actualCostInput) || 0;

            let act = allData.runningActivities.splice(index, 1)[0];
            act.actualCost = actualCost;
            delete act.estCost;

            if(!allData.pastActivities) allData.pastActivities = [];
            allData.pastActivities.push(act);

            localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));
            renderRunningActivitiesTable();
            renderPastActivitiesTable();
            alert('কর্মসূচিটি সফলভাবে সমাপ্ত করে পূর্ববর্তী কর্মসূচি তালিকায় স্থানান্তরিত করা হয়েছে!');
        }

        function deleteRunningActivity(index) {
            if(confirm('এই চলমান কর্মসূচিটি মুছে ফেলতে চান?')) {
                allData.runningActivities.splice(index, 1);
                localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));
                renderRunningActivitiesTable();
            }
        }

        function renderPastActivitiesTable() {
            const tbody = document.getElementById('pastActivitiesTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';
            const items = allData.pastActivities || [];
            if(items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 8 : 7}" class="p-4 text-center text-gray-400 text-sm">কোনো পূর্ববর্তী কর্মসূচি নেই</td></tr>`;
                return;
            }
            items.forEach((item, index) => {
                let cost = item.actualCost ? `৳ ${Number(item.actualCost).toLocaleString()}` : '৳ ০';
                let actionTd = isAdmin ? `<td class="p-3 text-center"><button onclick="deletePastActivity(${index})" class="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-semibold hover:bg-rose-200">মুছে ফেলুন</button></td>` : '';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3">${index + 1}</td>
                        <td class="p-3 font-medium text-emerald-800">${item.name}</td>
                        <td class="p-3 text-xs">${item.startDate} হতে<br>${item.endDate}</td>
                        <td class="p-3">${item.beneficiary}</td>
                        <td class="p-3">${item.area}</td>
                        <td class="p-3 font-semibold text-emerald-700">${cost}</td>
                        <td class="p-3 text-xs">${item.costSector}</td>
                        ${actionTd}
                    </tr>
                `;
            });
        }

        function deletePastActivity(index) {
            if(confirm('এই পূর্ববর্তী কর্মসূচিটি তালিকা থেকে মুছে ফেলতে চান?')) {
                allData.pastActivities.splice(index, 1);
                localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));
                renderPastActivitiesTable();
            }
        }

        function renderDueTracking() {
            const tbody = document.getElementById('dueTrackingTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';
            
            let trackedMembers = [];
            ['committee', 'advisors', 'members', 'donors'].forEach(cat => {
                if(allData[cat]) {
                    allData[cat].forEach(m => {
                        if(Number(m.amount) > 0) {
                            trackedMembers.push(m);
                        }
                    });
                }
            });

            if(trackedMembers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400 text-sm">কোনো সদস্যের মাসিক অনুদান নির্ধারিত নেই</td></tr>`;
                return;
            }

            const currentMonthName = "অক্টোবর ২০২৬";

            trackedMembers.forEach((m) => {
                let paidAmount = 0;
                (allData.transactions || []).forEach(t => {
                    if(t.type === 'income' && t.donor === m.name) {
                        paidAmount += Number(t.amount);
                    }
                });

                let due = Number(m.amount) - paidAmount;
                if(due < 0) due = 0;

                tbody.innerHTML += `
                    <tr>
                        <td class="p-3 font-medium">${m.name}</td>
                        <td class="p-3">${m.role}</td>
                        <td class="p-3">${currentMonthName}</td>
                        <td class="p-3 font-semibold">৳ ${Number(m.amount).toLocaleString()}</td>
                        <td class="p-3 text-green-600 font-semibold">৳ ${paidAmount.toLocaleString()}</td>
                        <td class="p-3 font-semibold ${due > 0 ? 'text-rose-600' : 'text-gray-500'}">৳ ${due.toLocaleString()}</td>
                    </tr>
                `;
            });
        }

        function addUniversalMember(e) {
            e.preventDefault();
            const category = document.getElementById('categorySelect').value;
            const name = document.getElementById('memberName').value;
            const role = document.getElementById('memberRole').value;
            const amount = parseFloat(document.getElementById('memberMonthlyAmount').value) || 0;
            const phone = document.getElementById('memberPhone').value;

            if(!allData[category]) allData[category] = [];
            allData[category].push({ name, role, amount, phone });
            localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));

            document.getElementById('globalMemberForm').reset();
            document.getElementById('memberMonthlyAmount').value = "0";
            renderAllTables();
            alert('সফলভাবে সংশ্লিষ্ট তালিকায় যুক্ত হয়েছে!');
            showSection(category);
        }

        function deleteItem(category, index) {
            if(confirm('আপনি কি এই সদস্যকে তালিকা থেকে মুছে ফেলতে চান?')) {
                allData[category].splice(index, 1);
                localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));
                renderAllTables();
            }
        }

        function addTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('transType').value;
            const donor = document.getElementById('transDonorName').value;
            const sector = document.getElementById('transSector').value;
            const amount = parseFloat(document.getElementById('transAmount').value);
            const date = document.getElementById('transDate').value;

            if(!allData.transactions) allData.transactions = [];
            allData.transactions.push({ date, donor, sector, type, amount });
            localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));

            document.getElementById('transactionForm').reset();
            renderTransactions();
            renderDueTracking();
            updateDashboardStats();
            alert('হিসাব সফলভাবে সংরক্ষিত হয়েছে!');
        }

        function renderTransactions() {
            const tbody = document.getElementById('transactionsTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';
            const txns = allData.transactions || [];
            if(txns.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 6 : 5}" class="p-4 text-center text-gray-400 text-sm">কোনো লেনদেন নেই</td></tr>`;
            } else {
                txns.forEach((t, index) => {
                    let actionTd = isAdmin ? `<td class="p-3 text-center"><button onclick="deleteTransaction(${index})" class="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-semibold hover:bg-rose-200">ডিলিট</button></td>` : '';
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3">${t.date}</td>
                            <td class="p-3 font-medium text-emerald-800">${t.donor || '-'}</td>
                            <td class="p-3">${t.sector}</td>
                            <td class="p-3"><span class="px-2 py-1 rounded text-xs font-semibold ${t.type === 'income' ? 'bg-green-100 text-green-700' : 'bg-rose-100 text-rose-700'}">${t.type === 'income' ? 'আয়' : 'ব্যয়'}</span></td>
                            <td class="p-3 font-semibold ${t.type === 'income' ? 'text-green-600' : 'text-rose-600'}">৳ ${Number(t.amount).toLocaleString()}</td>
                            ${actionTd}
                        </tr>
                    `;
                });
            }
        }

        function deleteTransaction(index) {
            if(confirm('এই হিসাবটি মুছে ফেলতে চান?')) {
                allData.transactions.splice(index, 1);
                localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));
                renderTransactions();
                renderDueTracking();
                updateDashboardStats();
            }
        }

        function convertAmountToWords() {
            const amtElem = document.getElementById('rcvAmount');
            const wordsElem = document.getElementById('rcvAmountWords');
            if(!amtElem || !wordsElem) return;
            const amt = amtElem.value;
            wordsElem.value = amt ? amt + " টাকা মাত্র" : "";
        }

        let receiptCounter = 1;
        function previewReceipt(e) {
            e.preventDefault();
            receiptCounter++;
            let serialStr = String(receiptCounter).padStart(3, '0');
            const name = document.getElementById('rcvDonorName').value;
            const designation = document.getElementById('rcvDesignation').value;
            const sector = document.getElementById('rcvSector').value;
            const amount = document.getElementById('rcvAmount').value;
            const date = document.getElementById('rcvDate').value || new Date().toISOString().split('T')[0];

            document.getElementById('viewReceiptNo').innerText = `AKF-2026-${serialStr}`;
            document.getElementById('viewReceiptDate').innerText = date;
            document.getElementById('viewDonorName').innerText = name;
            document.getElementById('viewDesignation').innerText = designation;
            document.getElementById('viewSector').innerText = sector;
            document.getElementById('viewAmountNum').innerText = `৳ ${Number(amount).toLocaleString()}.০০`;
            document.getElementById('viewAmountWords').innerText = amount + " টাকা মাত্র";
            alert('রিসিট সফলভাবে প্রস্তুত হয়েছে!');
        }

        function downloadPDF() {
            alert('প্রিন্ট ডায়ালগ থেকে "Save as PDF" সিলেক্ট করে পিডিএফ ডাউনলোড করতে পারবেন।');
            window.print();
        }

        function generateNewReceipt() {
            document.getElementById('receiptForm').reset();
            document.getElementById('rcvAmountWords').value = "";
        }

        function addCalendarEvent(e) {
            e.preventDefault();
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            const timeLocation = document.getElementById('eventTimeLocation').value;

            if(!allData.calendarEvents) allData.calendarEvents = [];
            allData.calendarEvents.push({ title, date, timeLocation });
            localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));

            document.getElementById('eventForm').reset();
            renderCalendarEvents();
            alert('নতুন ইভেন্ট বা সূচি সফলভাবে যুক্ত হয়েছে!');
        }

        function renderCalendarEvents() {
            const tbody = document.getElementById('calendarEventsTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';
            const events = allData.calendarEvents || [];
            if(events.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 4 : 3}" class="p-4 text-center text-gray-400 text-sm">কোনো ইভেন্ট বা সূচি নেই</td></tr>`;
                return;
            }
            events.forEach((ev, index) => {
                let actionTd = isAdmin ? `<td class="p-3 text-center"><button onclick="deleteCalendarEvent(${index})" class="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-semibold hover:bg-rose-200">মুছে ফেলুন</button></td>` : '';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-semibold text-emerald-700">${ev.date}</td>
                        <td class="p-3 font-medium">${ev.title}</td>
                        <td class="p-3 text-sm text-gray-600">${ev.timeLocation}</td>
                        ${actionTd}
                    </tr>
                `;
            });
        }

        function deleteCalendarEvent(index) {
            if(confirm('এই ইভেন্টটি মুছে ফেলতে চান?')) {
                allData.calendarEvents.splice(index, 1);
                localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));
                renderCalendarEvents();
            }
        }

        function addGalleryItem(e) {
            e.preventDefault();
            const title = document.getElementById('galleryTitle').value;
            const url = document.getElementById('galleryUrl').value;

            if(!allData.galleryImages) allData.galleryImages = [];
            allData.galleryImages.push({ title, url });
            localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));

            document.getElementById('galleryForm').reset();
            renderGallery();
            alert('নতুন ছবি গ্যালারীতে যুক্ত হয়েছে!');
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            if(!grid) return;
            grid.innerHTML = '';
            const images = allData.galleryImages || [];
            if(images.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 text-sm col-span-3 text-center">কোনো ছবি নেই</p>`;
                return;
            }
            images.forEach((img, index) => {
                let deleteBtn = isAdmin ? `<button onclick="deleteGalleryItem(${index})" class="absolute top-2 right-2 bg-rose-600 text-white text-xs px-2 py-1 rounded shadow">ডিলিট</button>` : '';
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow overflow-hidden relative group">
                        <img src="${img.url}" alt="${img.title}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <p class="font-semibold text-sm text-emerald-800">${img.title}</p>
                        </div>
                        ${deleteBtn}
                    </div>
                `;
            });
        }

        function deleteGalleryItem(index) {
            if(confirm('এই ছবিটি গ্যালারী থেকে মুছে ফেলতে চান?')) {
                allData.galleryImages.splice(index, 1);
                localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));
                renderGallery();
            }
        }

        function submitContactMessage(e) {
            e.preventDefault();
            const name = document.getElementById('contactSenderName').value;
            const phone = document.getElementById('contactSenderPhone').value;
            const message = document.getElementById('contactSenderMsg').value;
            const date = new Date().toLocaleDateString('bn-BD');

            if(!allData.messages) allData.messages = [];
            allData.messages.push({ date, name, phone, message });
            localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));

            e.target.reset();
            alert('আপনার বার্তাটি সফলভাবে প্রেরিত হয়েছে! ধন্যবাদ।');
        }

        function renderInbox() {
            const tbody = document.getElementById('inboxTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';
            const msgs = allData.messages || [];
            if(msgs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400 text-sm">কোনো বার্তা নেই</td></tr>`;
                return;
            }
            msgs.forEach((m, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 text-xs text-gray-500">${m.date}</td>
                        <td class="p-3 font-medium">${m.name}</td>
                        <td class="p-3">${m.phone}</td>
                        <td class="p-3 text-sm">${m.message}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteInboxMessage(${index})" class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded text-xs font-semibold hover:bg-rose-200">ডিলিট</button>
                        </td>
                    </tr>
                `;
            });
        }

        function deleteInboxMessage(index) {
            if(confirm('এই বার্তাটি ইনবক্স থেকে মুছে ফেলতে চান?')) {
                allData.messages.splice(index, 1);
                localStorage.setItem('alkhidmahAllData', JSON.stringify(allData));
                renderInbox();
            }
        }

        window.onload = function() {
            applyAdminModeUI();
            showSection('home');
        };
    </script>
